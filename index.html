<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{background:#ffd6de;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;font-family:sans-serif}
.card{background:white;padding:18px;border-radius:24px;max-width:360px;width:90%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.1)}
.board{display:grid;grid-template-columns:repeat(8,1fr);border:4px solid #b58863;border-radius:12px;overflow:hidden;width:100%;aspect-ratio:1}
.sq{display:flex;justify-content:center;align-items:center;font-size:28px;aspect-ratio:1}
.light{background:#f0d9b5}.dark{background:#b58863}
.msg{margin-top:10px;color:#d6336c;font-weight:bold}
button{margin-top:12px;background:#ff4d6d;color:white;border:0;padding:10px 18px;border-radius:20px}
</style>
</head>
<body>
<div class="card">
<div style="color:#ff4d6d;font-weight:bold">Rating: <span id="r">200</span> | Puzzle <span id="p">1</span>/10</div>
<h2 id="title" style="color:#ff2e6d;margin:8px 0">Level 1 unlocked 🔓❤️</h2>
<p id="desc">White to move - Mate in 1<br><small>You are smarter than I thought.. 👀❤️</small></p>
<div class="board" id="board"></div>
<div class="msg" id="msg">Rook ko dekh 😊</div>
<button onclick="next()">Next Puzzle ❤️</button>
</div>
<script>
const puzzles=[
{fen:"6k1/5ppp/8/8/8/5PPP/5RK1",msg:"Rook ko dekh 😊",title:"Level 1 unlocked 🔓❤️",desc:"White to move - Mate in 1 (Easy)"},
{fen:"6k1/5ppp/8/8/8/8/5PPP/6RK",msg:"Queen side? 😉",title:"Level 2 - Cute but tricky 😍",desc:"White to move - Mate in 1"},
{fen:"5R1k/6pp/8/8/8/8/5PPP/6K1",msg:"Ab toh pro ho gayi 😘",title:"Level 3 - You are getting good! ❤️",desc:"White to move - Mate in 1"},
]
let idx=0;
const map={'K':'♔','Q':'♕','R':'♖','B':'♗','N':'♘','P':'♙','k':'♚','q':'♛','r':'♜','b':'♝','n':'♞','p':'♟'};
function draw(){
 let b=document.getElementById('board'); b.innerHTML='';
 let fen=puzzles[idx].fen.split('/');
 for(let r=0;r<8;r++){
   let row=fen[r]; let c=0;
   for(let ch of row){
     if(!isNaN(ch)){ for(let k=0;k<parseInt(ch);k++){ let d=document.createElement('div'); d.className='sq '+((r+c)%2==0?'light':'dark'); b.appendChild(d); c++; } }
     else{ let d=document.createElement('div'); d.className='sq '+((r+c)%2==0?'light':'dark'); d.textContent=map[ch]||''; b.appendChild(d); c++; }
   }
 }
 document.getElementById('r').textContent=200+idx*120;
 document.getElementById('p').textContent=idx+1;
 document.getElementById('msg').textContent=puzzles[idx].msg;
 document.getElementById('title').textContent=puzzles[idx].title;
 document.getElementById('desc').innerHTML=puzzles[idx].desc;
}
function next(){ idx=(idx+1)%puzzles.length; draw(); if(idx==2) alert("Maneesha, you are my checkmate ❤️"); }
draw();
</script>
</body>
</html>
