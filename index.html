<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Favorite Person ❤️</title>
    <!-- Chessboard.js CSS -->
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        body {
            background-color: #fff0f3;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            color: #590d22;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        #game-container {
            background: #ffffff;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(128, 0, 32, 0.1);
            text-align: center;
            max-width: 380px;
            width: 90%;
            position: relative;
        }

        #board {
            width: 320px;
            margin: 0 auto 15px auto;
        }

        /* Custom Pink Chessboard Theme */
        .white-1e1d7 {
            background-color: #ffccd5 !important;
        }
        .black-3c85d {
            background-color: #c9184a !important;
        }

        #instruction {
            font-size: 0.95rem;
            color: #800f2f;
            font-weight: 600;
        }

        /* Popup Modal Overlay */
        #popup-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(89, 13, 34, 0.4);
            backdrop-filter: blur(4px);
            z-index: 999;
            justify-content: center;
            align-items: center;
        }

        /* Popup Card */
        #popup-card {
            background: #ffffff;
            padding: 25px;
            border-radius: 20px;
            max-width: 320px;
            width: 85%;
            text-align: center;
            box-shadow: 0 15px 35px rgba(128, 0, 32, 0.2);
            border: 2px solid #ffb3c1;
            animation: popUpAnim 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popUpAnim {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        #popup-text {
            font-size: 1.05rem;
            line-height: 1.5;
            white-space: pre-line;
            color: #590d22;
            margin-bottom: 20px;
            font-weight: 500;
        }

        button {
            background-color: #a4133c;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            width: 100%;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(164, 19, 60, 0.3);
            transition: background 0.2s;
        }

        button:hover {
            background-color: #800f2f;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <h1 id="level-title">Level 1</h1>
        <div id="board"></div>
        <div id="instruction">Find the best move! ✨</div>
    </div>

    <!-- Popup Modal -->
    <div id="popup-overlay">
        <div id="popup-card">
            <p id="popup-text"></p>
            <button onclick="nextLevel()">Next Puzzle ✨</button>
        </div>
    </div>

    <!-- Dependencies -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    
    <script>
        let board = null;
        let game = new Chess();
        let currentLevel = 0;

        const levels = [
            {
                rating: 200,
                fen: "r1bqkbnr/pppp1ppp/2n5/4p3/2B1P3/5N2/PPPP1PPP/RNBQK2R b KQkq - 3 3",
                solution: "g8f6",
                message: "🎉 Level 1 unlocked! 🔓\n\nOkay, you’re smarter than I thought. 👀😂"
            },
            {
                rating: 500,
                fen: "r1bqkb1r/pppp1ppp/2n2n2/4p3/2B1P3/5N2/PPPP1PPP/RNBQK2R w KQkq - 4 4",
                solution: "f3g5",
                message: "Level 2 unlocked 🔓❤️\n\nI like your eyes, your voice…\nand that big big noseeee of yours. 👀😂❤️"
            },
            {
                rating: 1000,
                fen: "r1bqk2r/pppp1ppp/2n2n2/2b1p3/2B1P3/3P1N2/PPP2PPP/RNBQK2R w KQkq - 1 6",
                solution: "e1g1",
                message: "Level 3 unlocked 🔓❤️\n\nOkay, your smile is kinda dangerous too… 😏\nBut don’t smile too much—you still have a puzzle to solve. 😂♟️\n\n9 more… let’s see if you can keep up. 😏❤️"
            },
            {
                rating: 1200,
                fen: "r1bq1rk1/pppp1ppp/2n2n2/2b1p3/2B1P3/3P1N2/PPPN1PPP/R1BQ1RK1 b - - 3 7",
                solution: "d7d6",
                message: "Level 4 unlocked 🔓❤️\n\nI don’t know when it happened…\nbut somehow, talking to you became my favourite part of the day. 🫠❤️"
            },
            {
                rating: 1400,
                fen: "r1bq1rk1/pp1pnppp/2np4/2b1p3/2B1P3/3P1N2/PPPN1PPP/R1BQ1RK1 w - - 0 8",
                solution: "c2c3",
                message: "Level 5 unlocked 🔓❤️️\n\nI love listening to you…\nsometimes I just want you to keep talking, while I sit there and listen to you forever. 🫠❤️"
            },
            {
                rating: 1600,
                fen: "r1bq1rk1/pp1pnppp/2np4/2b1p3/2B1P3/1QPP1N2/PP1N1PPP/R1B2RK1 b - - 0 9",
                solution: "c5b6",
                message: "Level 6 unlocked 🔓❤️\n\nHaaaye, tumhari aankheinnn… 👀❤️\nI could just stare into your eyes forever."
            },
            {
                rating: 1700,
                fen: "r1bq1rk1/pp1pnppp/1bnp4/4p3/2B1P3/1QPP1N2/PP1N1PPP/R1B2RK1 w - - 1 10",
                solution: "a2a4",
                message: "Level 7 unlocked 🔓❤️\n\nI don’t know what it is about you…\nbut somehow, I always end up wanting a little more of you. ❤️\nAnd honestly… I’m not even complaining. 😏"
            },
            {
                rating: 1800,
                fen: "r1bq1rk1/pp2nppp/1bnp4/4p3/N1B1P3/1QPP1N2/1P1N1PPP/R1B2RK1 b - - 0 11",
                solution: "b6c7",
                message: "Puzzle 8\nLevel 8 unlocked 🔓❤️\nI think I’m falling for you… 🫠❤️"
            },
            {
                rating: 1900,
                fen: "r1bq1rk1/ppbn1ppp/2np4/4p3/N1B1P3/1QPP1N2/1P1N1PPP/R1B2RK1 w - - 1 12",
                solution: "b2b4",
                message: "Puzzle 9\nLevel 9 unlocked 🔓❤️\nYou’ve become really special to me. ❤️"
            },
            {
                rating: 2000,
                fen: "r2q1rk1/ppbn1ppp/2npb3/4p3/NPB1P3/2PP1N2/3N1PPP/R1BQ1RK1 b - - 0 13",
                solution: "e8g8",
                message: "Puzzle 10\nLevel 10 unlocked 🔓❤️\nNo more puzzles…\nI love you. ❤️"
            }
        ];

        function loadLevel(index) {
            if (index >= levels.length) return;

            currentLevel = index;
            game.load(levels[currentLevel].fen);
            
            $('#level-title').text(`Level ${currentLevel + 1} (Rating: ${levels[currentLevel].rating})`);
            $('#popup-overlay').hide();

            let config = {
                position: levels[currentLevel].fen,
                draggable: true,
                onDragStart: onDragStart,
                onDrop: onDrop,
                onSnapEnd: onSnapEnd
            };
            
            $('#board').empty();
            board = Chessboard('board', config);
        }

        function onDragStart(source, piece, position, orientation) {
            if (game.game_over()) return false;
            if ((game.turn() === 'w' && piece.search(/^b/) !== -1) ||
                (game.turn() === 'b' && piece.search(/^w/) !== -1)) {
                return false;
            }
        }

        function onDrop(source, target) {
            let move = game.move({
                from: source,
                to: target,
                promotion: 'q'
            });

            if (move === null) return 'snapback';

            let playedMoveStr = source + target;
            let expectedMoveStr = levels[currentLevel].solution;

            if (playedMoveStr === expectedMoveStr) {
                $('#popup-text').text(levels[currentLevel].message);
                $('#popup-overlay').css('display', 'flex').hide().fadeIn(300);
            } else {
                game.undo();
                return 'snapback';
            }
        }

        function onSnapEnd() {
            board.position(game.fen());
        }

        function nextLevel() {
            if (currentLevel + 1 >= levels.length) {
                alert("You've finished all the levels! ❤️");
                return;
            }
            loadLevel(currentLevel + 1);
        }

        // Use window.load to ensure the piece images are fully fetched before building the board
        $(window).on('load', function() {
            loadLevel(0);
        });
    </script>
</body>
</html>
