p{color:#444;white-space:pre-line;line-height:1.5;font-size:15px;min-height:60px}

button{background:#ff2e63;color:white;border:none;padding:12px 24px;border-radius:50px;font-size:15px;margin-top:10px;cursor:pointer;width:100%}
.hint{font-size:12px;color:#999;margin-top:8px}
.rating{background:#fff0f3;color:#ff2e63;display:inline-block;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:bold;margin-bottom:8px}
